# Deploys site/ to GitHub Pages. LIVE since 2026-09-12: the Founder commissioned the
# enablement that day (DECISIONS.md 2026-09-12 DRA-57; HELM.md 2026-09-14 ~7:00 PM CT),
# so the DRA-48 T4 publish gate this header used to name is LIFTED / GO recorded, and
# every push to main touching site/** now publishes to
# https://dranakcorps-bot.github.io/EQBuddy/ — treat a copy edit here as a public edit.
#
# Do NOT restate the enablement state from this comment: it is prose and it went stale
# once already. Read it — `gh api repos/DranakCorps-bot/EQBuddy/pages` / `has_pages` —
# or say it is unchecked (DECISIONS.md 2026-09-12 DRA-57 §3, Helm ADOPT).
# Disabling is one `DELETE …/pages` call and is David's decision, not Soft's.
#
# HOURLY LIVE FIGURES (Founder decision 2026-09-28, EQBuddy Evolved 0.1 Beta). The
# schedule re-deploys main every hour so the five live tiles in the hero's stat strip
# (Total installs, Hours used, Peak daily users, Peak weekly active, Peak concurrent) stay
# current. Before the artifact is uploaded, scripts/landing-telemetry.ps1 fetches the
# telemetry worker's /metrics.json, validates it, and writes a TRIMMED same-origin
# site/live.json into THIS RUN'S WORKSPACE — the file that gets published. (It no longer
# reads the GitHub releases API: the v1-era downloads tile it fed was retired the same day.)
#   * Nothing is committed: this job has `contents: read` and never pushes.
#   * The visitor's browser fetches live.json from the page's own origin, so "this page
#     makes no third-party requests" stays true.
#   * A failed fetch or a failed validation does NOT fail the deploy. The script still
#     writes live.json with that half marked unavailable, and the page paints dashes.
#     If the script cannot run at all (the step is continue-on-error), the committed
#     site/live.json — explicitly unavailable, no figure in it — is what gets published.
#     Either way the page never shows the previous hour's numbers or an invented one.
# Guard: LandingSourceClaimsTests.ThePagesWorkflowWritesLiveFiguresIntoTheArtifactOnly.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/landing-telemetry.ps1'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Live figures into the artifact (never committed; a failure publishes "unavailable")
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: pwsh -NoProfile -File scripts/landing-telemetry.ps1 -OutFile site/live.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v5
