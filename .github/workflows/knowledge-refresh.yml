# Weekly knowledge refresh: re-harvest eqlwiki-derived catalogs and open a PR
# with the delta. Born from the #65 wiki loop — players push loot/spawn
# observations to the wiki through EQBuddy itself, so the embedded catalogs
# need a cadence, not a memory.
#
# The refresh is incremental (recentchanges-driven cache eviction; the wikitext
# cache is committed), so a quiet week costs ~2 API requests and no PR at all.
# Curated catalogs (SpawnCatalog, AaCatalog, Mez/Cc/RegenSpells) are never
# auto-written — the report flags them for human review instead.
#
# Requires (Settings → Actions → General): "Allow GitHub Actions to create and
# approve pull requests".

name: Knowledge refresh

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC — quiet hours US, before the week's play
  workflow_dispatch: {}    # and on demand, e.g. after a burst of wiki edits

# Default deny; the refresh job re-grants exactly what pushing the branch and
# managing the rolling PR require.
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the knowledge-refresh branch
      pull-requests: write   # create/update the rolling PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run knowledge refresh
        run: python scripts/harvests/refresh.py

      - name: Open or update the knowledge PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes — catalogs already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH=knowledge-refresh
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Knowledge refresh: eqlwiki catalogs, $(date -u +%Y-%m-%d)"
          git push -f origin "$BRANCH"
          # One rolling PR: create it if absent, refresh the body if it exists.
          if ! gh pr create --base main --head "$BRANCH" \
               --title "Knowledge refresh: eqlwiki catalogs" \
               --body-file scripts/harvests/eqlwiki/refresh-report.md; then
            gh pr edit "$BRANCH" \
               --body-file scripts/harvests/eqlwiki/refresh-report.md
          fi
