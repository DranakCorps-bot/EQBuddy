name: CI

on:
  push:
    branches: [main]
  pull_request:
  # No `run-e2e` input any more: the end-to-end suite runs in every event this workflow
  # handles, so a switch that turned it on would be a flag that does nothing.
  workflow_dispatch:

# Build-and-test only: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 so the tags are here. The What's-new guard below compares the file
      # against the newest tag's copy of it, and a shallow checkout has no tags at all — the
      # guard would skip cleanly and prove nothing, which is the shape of a gate that reads
      # as coverage (CLAUDE.md trap 34).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Before the build, because it costs a second and it is the only gate that can see a
      # What's-new entry edited after its version shipped — a disagreement with a git tag,
      # which no unit test can reach. Twice in three releases before it existed.
      - name: What's-new entries that already shipped are unchanged
        run: pwsh -NoProfile -File scripts/whatsnew-guard.ps1

      # EQBuddy Evolved (2.x) develops local-only, and release.ps1 is the only thing in the
      # repo that can break that. The guard is in check.ps1 and in release.ps1 already —
      # this is the copy that does not depend on anyone remembering to run either. A PR that
      # re-adds the OneDrive copy, or a reachable `gh release create`, fails HERE.
      #
      # Its third check reads the live update folder, which no runner has; it fails open with
      # a loud SKIPPED line, so what CI enforces is the script's shape. That is the half a
      # pull request can get wrong.
      - name: Evolved 2.x stays local-only
        run: pwsh -NoProfile -File scripts/evolved-channel-guard.ps1

      # The channel ledgers (HELM.md, HELM-FEEDBACK.md and their siblings) may not be
      # emptied, truncated or wholesale-replaced by a pull request. Three times in six
      # days a commit whose message said it was signing something destroyed one instead —
      # PR #493 and the 2026-09-10 amend deleted both HELM files outright, and each needed
      # a restore commit. CLAUDE.md already carried the rule; trap 60(c) ended "No guard
      # yet; that is a named hole". THIS is the copy that does not depend on an agent
      # remembering the rule while its automation lands an empty tree.
      #
      # On a pull_request the checkout is the merge result, so the base sha below asks the
      # only question that matters: what would landing this do to the ledgers? The guard
      # fails OPEN with a loud SKIPPED line when no base resolves (fetch-depth: 0 above is
      # what keeps that from being the normal case).
      - name: Channel ledgers are never wiped, truncated or replaced
        run: >
          pwsh -NoProfile -File scripts/channel-wipe-guard.ps1
          -BaseRef "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

      # Its prove-fail, in a throwaway repo under RUNNER_TEMP: every check above driven
      # into the red at least once. A wipe guard nobody has watched refuse is trap 34.
      - name: Channel wipe guard refuses each violation
        run: pwsh -NoProfile -File scripts/channel-wipe-guard-selftest.ps1

      # The other half of the same policy, and until now the missing half. The guard above
      # forbids a ledger getting SMALLER by the wrong mechanism; nothing forbade one getting
      # BIGGER without limit, which is a failure that happens every day rather than three
      # times in six days. DRA-73 rev 2 (approved 2026-09-14) set a 30-day / ~64 KB rotation
      # policy and named this ratchet; DRA-75 shipped the rotation, the ratchet did not ship,
      # and DRA-73 then closed — so the check had no live owner until DRA-26 rev 3 card A.
      #
      # It arrives with 9 of the 11 rostered files ALREADY over the limit (HELM.md by 14x),
      # so `scripts/channel-size-baseline.psd1` grandfathers those nine at their measured
      # size plus the hotspot ratchet's 10%. That table only ever shrinks, and this guard is
      # what enforces that: a row may not be raised or added, and a rotation must delete its
      # row in the same pull request.
      #
      # Same -BaseRef expression as the wipe guard above, for the same reason and with the
      # same loud SKIPPED line when no base resolves. Every arm asks what THIS pull request
      # did to a file, never what size the file happens to be — on a merge-result checkout
      # that difference is the whole guard, because DRA-144 is still rotating these files and
      # failing every author for the branch they merged into is not enforcement.
      - name: Channel ledgers are not grown past 64 KiB
        run: >
          pwsh -NoProfile -File scripts/channel-size-guard.ps1
          -BaseRef "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

      # Its prove-fail, same idiom and same reason as the wipe guard's above: twenty-five
      # cases in a throwaway repo, every arm driven into the red at least once and fifteen
      # shapes asserted GREEN — a size ratchet's real risk is refusing an append that policy
      # allows. Five of those (DRA-284) are the headroom WARN band, which changes no exit
      # code and so would go dead silently: only its own cases can catch that, and one of
      # them builds a real append history so the ruled `3 × median append` term is what
      # fires rather than the 2% floor.
      - name: Channel size ratchet refuses each violation
        run: pwsh -NoProfile -File scripts/channel-size-selftest.ps1

      # No commit a pull request ADDS may be authored or committed as the Founder
      # (DRA-226). Every commit on three open DRA-216 branches - 7 commits, 4,589 lines of
      # agent-written code - was authored AND committed as
      # `David Edwards <david.edwards08@gmail.com>`, and was caught only because a Planner
      # review happened to read the commit authors. It is rewritable on an unmerged branch
      # and impossible afterwards, so the check has to sit here, before the merge.
      #
      # The cause was environmental and is not fixable from inside the repository: there is
      # more than one EQBuddy working tree on the Founder's machine, `~/.gitconfig` has no
      # [user] block, and one dispatch clone carried his identity - which ~20 linked
      # worktrees then inherited, because a worktree shares its clone's config. The clones
      # are fixed; this is the copy that does not depend on the next one being right.
      #
      # RANGE, and it is the whole design: base..head MINUS main. `main` carries 126
      # commits this guard would refuse, so a check that read history would be permanently
      # red and would teach everyone to ignore it (trap 74). It judges only what this pull
      # request adds.
      #
      # HEAD SHA, NOT HEAD. `actions/checkout` leaves the MERGE RESULT checked out and that
      # merge commit is authored by GitHub rather than by the author, so judging HEAD would
      # fail every pull request on a commit its author never made.
      #
      # THE FOUNDER'S DOOR is the `founder-commit` label. An agent running inside his clone
      # produces a commit byte-identical in identity to one he types himself, so nothing
      # read off the commit object can separate them - the separation has to come from
      # outside it. A human puts the label on; it admits HIS identity for that pull request
      # only, and every other unknown identity stays refused. An agent cannot label a PR.
      - name: Commits this pull request adds are authored by the bot
        if: github.event_name == 'pull_request'
        run: >
          pwsh -NoProfile -File scripts/commit-identity-guard.ps1
          -BaseRef "${{ github.event.pull_request.base.sha }}"
          -HeadRef "${{ github.event.pull_request.head.sha }}"
          ${{ contains(github.event.pull_request.labels.*.name, 'founder-commit') && '-AllowFounder' || '' }}

      # Its prove-fail, same idiom and same reason as the two above. Six refusals driven
      # red in a throwaway repo - including the shape that started the card, a commit whose
      # NAME is the bot's and only whose email is the Founder's, which GitHub renders as
      # "David Edwards" and which any name-based check would wave through. Every allow-list
      # row is exercised too (trap 78: a dead row has no symptom), and both fail-open paths
      # are asserted to SAY they judged nothing, because an empty range is exactly how a
      # broken range computation would read as green.
      - name: Commit-identity guard refuses each violation
        run: pwsh -NoProfile -File scripts/commit-identity-selftest.ps1

      # The Challenger gate's keyed line (DRA-309 S3, off the DRA-305 SPEC's §5 edit table,
      # §3.2 seam and §7 item 4). Two arms, and the pairing is the whole design (trap 34):
      #
      # THE MUST-LIST is the half that can see an ABSENCE. A forbid-scan alone is green on a
      # repository with no keyed lines at all, which is also exactly what a repository that
      # quietly stopped walking the gate looks like. The list is curated and names the plans
      # whose C1-C5 test was EVALUATED.
      #
      # THE FORBID-SCAN reports ZERO keyed lines inside a slice sequence. The gate fires
      # once, at a plan's SIGN, and never per slice - a keyed line on a D(n+1) hand-off is
      # the gate having drifted into the slice sequence, which would re-create one layer
      # down the 84% of parked wait the signed-plan-authorizes-every-slice cutover bought
      # out. That is reported as a defect.
      #
      # SCOPE IS "EVALUATED", NOT "EVERY PLAN". A plan that never reached the C-test is
      # asked for nothing; demanding the line universally would re-impose the every-card tax
      # DRA-306's PROCEED-WITH condition removed, and would be red across the corpus for a
      # reason nobody changed (trap 74).
      - name: Gate-evaluated plans carry their keyed challenge line
        run: pwsh -NoProfile -File scripts/challenge-line-guard.ps1

      # Its prove-fail, same idiom and same reason as the ones above. Ten refusals driven
      # red over throwaway corpora and five allowed shapes driven green, because a guard
      # that refused a plan which never reached the C-test, or read prose about the rule as
      # a record of a walk, would be worse than none. BOTH curated lists are proven
      # load-bearing by mutation rather than by inspection - emptying either must make the
      # guard REFUSE TO REPORT rather than pass, which is trap 78's own lesson.
      - name: Challenge-line guard refuses each violation
        run: pwsh -NoProfile -File scripts/challenge-line-selftest.ps1

      # Experiment A′ self-test (trap 70, EQBuddy lab): default second claim on
      # one work item must refuse. Throwaway StoreDir; not the live claims.
      - name: Soft seat claims refuse a duplicate default
        run: pwsh -NoProfile -File scripts/soft-seat-selftest.ps1

      # Paperclip merge-sync (DRA-77). The sync job itself only triggers on a
      # merge to the default branch, which means a pull request that changes it
      # cannot run it — the gate would first execute on the commit that already
      # landed. THIS is the copy a PR can see: it drives the branch-beats-body
      # precedence, every status disposition and the one-way scope lock, with no
      # secret, no network and no GitHub event.
      - name: Paperclip merge-sync decides, refuses and stays one-way
        run: pwsh -NoProfile -File scripts/merge-sync-selftest.ps1

      # The ExO dashboard's detectors (DRA-78, extended by DRA-127). Every other
      # self-test above has its own step here; this one had only `check.ps1`,
      # which CI never invokes — so the detectors behind every §6 number were
      # reachable by a human running one script and by nothing else. That is the
      # same shape as the gates above: a check whose only runner is someone
      # remembering to run it is not a gate, and `ExoDashboardTests` cannot cover
      # it because it reads the committed doc rather than the script.
      #
      # Offline by construction: the classifiers are pure, the feed walk runs
      # against a fake page source, and the one socket it opens is to a closed
      # local port on purpose — a refused connection is what it asserts.
      - name: ExO dashboard detectors fire, and no reason outlives its window
        run: pwsh -NoProfile -File scripts/exo-metrics.ps1 -SelfTest

      # The GENERATED catalogs are byte-reproducible from their inputs, and this is
      # where that claim is actually checked. `HarvestedGuides.json.gz` is 1,164 machine-
      # written guides; the only honest way to review the diff of a weekly refresh PR is
      # to know the generator and the committed file agree, because reading 11,000
      # objectives is not a review. None of the scripts fetches — they read the cache and
      # the committed catalogs — so this costs no eqlwiki request (consequence 7).
      #
      # `ZoneLevelBands.json` is plain JSON with no container, so unlike the guides gate it
      # compares the file itself — there is no zlib build for it to redden on (trap 74).
      #
      # Pinned python rather than the runner's default, for the reason the actions above
      # are pinned: a byte-for-byte assertion whose toolchain floats is a gate that can
      # start failing for a reason nobody changed.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generated catalogs match their generators
        run: |
          python scripts/harvests/eqlwiki/guides-transform.py --check
          python scripts/harvests/eqlwiki/epic-guides-build.py --check
          python scripts/harvests/eqlwiki/zonelevels-transform.py --check
          python scripts/harvests/eqlwiki/merchants-transform.py --check
          python scripts/harvests/eqlwiki/zone-eras-transform.py --check
          # Both era refusals are unreachable in the committed corpus, so --check green says
          # nothing about whether they fire (trap 78). --selftest runs them over synthetic
          # wikitext and writes nothing.
          python scripts/harvests/eqlwiki/zone-eras-transform.py --selftest

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build solution (WPF + Core + tests)
        run: dotnet build EQBuddy.slnx -c Release

      - name: Run tests
        run: dotnet test tests/EQBuddy.Tests/EQBuddy.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  # End-to-end: launches the real EQBuddy.exe against an isolated profile and asserts on
  # its rendered state (tests/EQBuddy.E2E). It runs on EVERY push and pull request as of
  # 2026-09-04 (E-2a).
  #
  # It used to be dispatch-only, and the reason given was that it "needs a desktop
  # session, which hosted runners don't guarantee a WPF window on". That was an assumption
  # nobody had tested: the first dispatch of this job on `main` came back 41 passed / 3
  # failed in four minutes, and all three failures were ours — two tests sampling a
  # baseline while the fixture was still replaying, and one asserting a cap that only a
  # monitor taller than the runner's 1024x768 can grant. With those fixed the suite is
  # 44/44 in ~4 minutes.
  #
  # WHY IT MATTERS THAT IT RUNS HERE: `src/EQBuddy` has no unit tests at all
  # (docs/TestPlan.md §5), and E-2c REMOVED the Avalonia lane, which was the repo's only
  # rendering coverage that ran on a push. This job is what takes its place — so a flake
  # here is a bug to fix, not a reason to gate it again.
  e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build solution (E2E launches the built exe)
        run: dotnet build EQBuddy.slnx -c Release

      - name: Run end-to-end suite
        env:
          # Where AppHarness writes a minidump of an app that has STOPPED TICKING. The
          # suite's own default is a folder beside the test binary; naming it here is what
          # lets the upload step below be one fixed path rather than a glob through
          # bin/Release. See AppHarness.CaptureFrozenProcess.
          EQBUDDY_E2E_ARTIFACTS: ${{ github.workspace }}\e2e-artifacts
        run: dotnet test tests/EQBuddy.E2E/EQBuddy.E2E.csproj -c Release --no-build --logger "console;verbosity=normal"

      # ONLY on failure, and only when there is something to upload. The GearCard
      # tick-freeze (Fable's RELEASE-GATE item, 2026-09-06) has produced four reds whose
      # artifacts were a complete, frozen debug.txt and an EMPTY error.log — nothing in
      # them can say what the UI thread was doing, which is the whole diagnosis. A
      # full-memory dump of the frozen process is the one thing that answers it, and it is
      # worth nothing if it dies with the runner.
      - name: Upload frozen-process minidumps
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-frozen-process-minidumps
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

# `build-avalonia-linux` (ubuntu-latest) was deleted here in E-2c, with the lane it built.
# EQBuddy Evolved is Windows-only, so a Linux job is a job with nothing to prove: the two
# things it ran are `EQBuddy.Tests` — which `build-and-test` above runs on every push —
# and the Avalonia render suite, whose per-file disposition is written down in
# `docs/v2/avalonia-test-disposition.md` rather than lost in this deletion.
#
# IT IS STILL A REQUIRED STATUS CHECK ON `main` at the time this landed. Removing the job
# without removing the context leaves every future PR waiting forever on a check nobody
# will report — see the PR body; the protection edit is out-of-tree and is part of merging
# this, not a follow-up.
