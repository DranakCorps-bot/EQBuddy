name: CI

on:
  push:
    branches: [main]
  pull_request:
  # No `run-e2e` input any more: the end-to-end suite runs in every event this workflow
  # handles, so a switch that turned it on would be a flag that does nothing.
  workflow_dispatch:

# Build-and-test only: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 so the tags are here. The What's-new guard below compares the file
      # against the newest tag's copy of it, and a shallow checkout has no tags at all — the
      # guard would skip cleanly and prove nothing, which is the shape of a gate that reads
      # as coverage (CLAUDE.md trap 34).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Before the build, because it costs a second and it is the only gate that can see a
      # What's-new entry edited after its version shipped — a disagreement with a git tag,
      # which no unit test can reach. Twice in three releases before it existed.
      - name: What's-new entries that already shipped are unchanged
        run: pwsh -NoProfile -File scripts/whatsnew-guard.ps1

      # EQBuddy Evolved (2.x) develops local-only, and release.ps1 is the only thing in the
      # repo that can break that. The guard is in check.ps1 and in release.ps1 already —
      # this is the copy that does not depend on anyone remembering to run either. A PR that
      # re-adds the OneDrive copy, or a reachable `gh release create`, fails HERE.
      #
      # Its third check reads the live update folder, which no runner has; it fails open with
      # a loud SKIPPED line, so what CI enforces is the script's shape. That is the half a
      # pull request can get wrong.
      - name: Evolved 2.x stays local-only
        run: pwsh -NoProfile -File scripts/evolved-channel-guard.ps1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build solution (WPF + Avalonia + Core + tests)
        run: dotnet build EQBuddy.slnx -c Release

      - name: Run tests
        run: dotnet test tests/EQBuddy.Tests/EQBuddy.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      # Renders the Avalonia widget headlessly. It is the Linux UI, but it needs no display
      # server, so running it here too catches breakage on the machine most changes are
      # written on rather than waiting for the Linux job.
      - name: Run Avalonia render tests
        run: dotnet test tests/EQBuddy.Avalonia.Tests/EQBuddy.Avalonia.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  # End-to-end: launches the real EQBuddy.exe against an isolated profile and asserts on
  # its rendered state (tests/EQBuddy.E2E). It runs on EVERY push and pull request as of
  # 2026-09-04 (E-2a).
  #
  # It used to be dispatch-only, and the reason given was that it "needs a desktop
  # session, which hosted runners don't guarantee a WPF window on". That was an assumption
  # nobody had tested: the first dispatch of this job on `main` came back 41 passed / 3
  # failed in four minutes, and all three failures were ours — two tests sampling a
  # baseline while the fixture was still replaying, and one asserting a cap that only a
  # monitor taller than the runner's 1024x768 can grant. With those fixed the suite is
  # 44/44 in ~4 minutes.
  #
  # WHY IT MATTERS THAT IT RUNS HERE: `src/EQBuddy` has no unit tests at all
  # (docs/TestPlan.md §5), and E-2 removes the Avalonia lane, which was the repo's only
  # rendering coverage that ran on a push. This job is what takes its place — so a flake
  # here is a bug to fix, not a reason to gate it again.
  e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build solution (E2E launches the built exe)
        run: dotnet build EQBuddy.slnx -c Release

      - name: Run end-to-end suite
        run: dotnet test tests/EQBuddy.E2E/EQBuddy.E2E.csproj -c Release --no-build --logger "console;verbosity=normal"

  build-avalonia-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build Avalonia app + tests on Linux
        run: |
          dotnet build src/EQBuddy.Avalonia/EQBuddy.Avalonia.csproj -c Release
          dotnet test tests/EQBuddy.Tests/EQBuddy.Tests.csproj -c Release
          # The one that would have caught a Linux UI that builds but doesn't draw.
          dotnet test tests/EQBuddy.Avalonia.Tests/EQBuddy.Avalonia.Tests.csproj -c Release
