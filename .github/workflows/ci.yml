name: CI

# DRA-4216 PROBE BRANCH ONLY - never merged. Measures the WholeFilePublish absent-name
# window on the hosted runner, which is the only box that has produced it since DRA-257.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Environment
        continue-on-error: true
        shell: pwsh
        run: |
          "cores=$([Environment]::ProcessorCount) temp=$env:TEMP"
          Get-Volume | Format-Table DriveLetter, FileSystem, Size -AutoSize | Out-String
          fltmc 2>&1 | Out-String
          try { Get-MpComputerStatus | Format-List RealTimeProtectionEnabled, OnAccessProtectionEnabled, BehaviorMonitorEnabled, AntivirusEnabled | Out-String } catch { "MpStatus: $_" }
          try { (Get-MpPreference).ExclusionPath -join ';' } catch { "MpPref: $_" }
      - name: Build probe
        run: dotnet build probe/probe.csproj -c Release -o probe/out
      - name: Probe unmasked, no load (x8)
        continue-on-error: true
        run: dotnet probe/out/probe.dll 4000 0 Normal 0 16
      - name: Probe unmasked, 2 load threads (x8)
        continue-on-error: true
        run: dotnet probe/out/probe.dll 4000 2 Normal 0 16
      - name: Probe unmasked, 4 load threads (x8)
        continue-on-error: true
        run: dotnet probe/out/probe.dll 4000 4 Normal 0 8
      - name: Probe single core, no load (x8)
        continue-on-error: true
        run: dotnet probe/out/probe.dll 4000 0 Normal 1 8
      - name: Real test class x10
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build tests/EQBuddy.Tests/EQBuddy.Tests.csproj -c Release *> build.log
          if ($LASTEXITCODE) { Get-Content build.log -Tail 30; exit 1 }
          foreach ($i in 1..10) {
            dotnet test tests/EQBuddy.Tests/EQBuddy.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~WholeFilePublishTests" *> "t$i.log"
            "run $i exit $LASTEXITCODE"
            Select-String -Path "t$i.log" -Pattern "torn reads|Passed!|Failed!|reader never ran|\[FAIL\]|Assert\.|Failed EQBuddy" | ForEach-Object { $_.Line }
          }
