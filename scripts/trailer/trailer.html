<!doctype html>
<!--
  EQBuddy Evolved launch trailer: the compositor.

  Nothing in here draws EQBuddy. Every picture of the app is a capture of the real build
  (scripts/trailer/README.md has the recipe), and this page only arranges them: framing,
  camera moves, spotlights, captions, the title cards. render.py loads this page headless,
  calls seek(t) for every frame and pipes the screenshots into ffmpeg, so a frame is a pure
  function of t: no clocks, no CSS animations, no randomness that is not seeded.
-->
<html>
<head>
<meta charset="utf-8">
<title>EQBuddy Evolved trailer</title>
<style>
  @font-face { font-family: EQS; src: url(fonts/EQBuddySans.ttf); font-weight: 400; }
  @font-face { font-family: EQS; src: url(fonts/EQBuddySans-SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: EQS; src: url(fonts/EQBuddySans-Bold.ttf); font-weight: 700; }
  :root {
    --bg: #181c21; --deep: #0e1014; --text: #e4e9ef; --muted: #8b96a3;
    --accent: #5fa8d3; --good: #6fbf7f; --warn: #e0a030; --line: rgba(228,233,239,.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--deep); }
  body { font-family: EQS, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
  #bg { opacity: 1; background: radial-gradient(1200px 800px at 50% 45%, #1b222b 0%, #0e1014 70%); }
  #motes { position: absolute; inset: 0; }
  #game { overflow: hidden; }
  #game img { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; }
  #gameShade { position: absolute; inset: 0;
    background: radial-gradient(1400px 900px at 50% 40%, rgba(14,16,20,0), rgba(14,16,20,.6)); }
  #hud { transform-origin: 0 0; }
  #hud img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #vignette { position: absolute; inset: 0; pointer-events: none; opacity: 1;
    background: radial-gradient(1500px 1000px at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }

  /* ---- type ---- */
  .kicker { font-weight: 600; font-size: 22px; letter-spacing: .32em; text-transform: uppercase; color: var(--accent); }
  .head { font-weight: 700; font-size: 68px; line-height: 1.06; letter-spacing: -.01em; }
  .head em { font-style: normal; color: var(--accent); }
  .sub { font-weight: 400; font-size: 30px; line-height: 1.35; color: #c5ced8; }
  .cap { position: absolute; opacity: 0; will-change: opacity, transform, filter; text-shadow: 0 2px 28px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.5); }
  .cap .line { display: block; }

  /* ---- a room window ---- */
  .win { position: absolute; border-radius: 16px; overflow: hidden; background: var(--bg);
    border: 1px solid rgba(228,233,239,.16);
    box-shadow: 0 50px 140px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4), 0 0 80px rgba(95,168,211,.10);
    transform-origin: 0 0; opacity: 0; will-change: transform, opacity; }
  .win img { display: block; }
  .spot { position: absolute; border-radius: 10px; opacity: 0;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 4000px rgba(8,10,13,.36), 0 0 28px rgba(95,168,211,.55), inset 0 0 18px rgba(95,168,211,.18); }
  .tag { position: absolute; font-weight: 600; font-size: 19px; color: #0e1014; background: var(--accent);
    padding: 5px 12px; border-radius: 999px; white-space: nowrap; opacity: 0; }

  /* ---- title cards ---- */
  .center { position: absolute; left: 0; right: 0; text-align: center; }
  #logo { position: absolute; left: 50%; top: 50%; opacity: 0; }
  .word { font-weight: 700; font-size: 132px; letter-spacing: -.02em; line-height: 1; }
  .word b { color: var(--accent); font-weight: 700; }
  .flash { position: absolute; inset: 0; background: #cfe6f5; opacity: 0; mix-blend-mode: screen; }
  .pill { display: inline-block; font-weight: 600; font-size: 24px; padding: 10px 22px; border-radius: 999px;
    border: 1px solid rgba(95,168,211,.5); color: var(--text); background: rgba(95,168,211,.10); margin: 0 8px; }
  .pillar { position: absolute; width: 380px; opacity: 0; }
  .pillar h3 { font-weight: 700; font-size: 34px; margin: 18px 0 10px; }
  .pillar p { font-size: 23px; line-height: 1.35; color: #aeb8c4; }
  .pillar .ico { width: 64px; height: 64px; border-radius: 16px; background: rgba(95,168,211,.14);
    border: 1px solid rgba(95,168,211,.45); display: grid; place-items: center; }
  .phone { position: absolute; width: 400px; height: 820px; border-radius: 56px; background: #07080a;
    padding: 14px; box-shadow: 0 60px 160px rgba(0,0,0,.7), 0 0 0 2px #2a3038, 0 0 60px rgba(95,168,211,.12);
    opacity: 0; transform-origin: 50% 50%; }
  .phone .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: var(--bg); }
  .phone img { width: 100%; display: block; }
  .phone .notch { position: absolute; left: 50%; top: 24px; width: 110px; height: 30px; margin-left: -55px;
    border-radius: 20px; background: #07080a; }
</style>
</head>
<body>
<div id="bg" class="layer"><canvas id="motes" width="1920" height="1080"></canvas></div>
<div id="game" class="layer"><img id="gameImg"><div id="gameShade"></div></div>
<div id="hud" class="layer"><img id="hudImg"></div>
<div id="rooms"></div>
<div id="caps"></div>
<div id="cards"></div>
<div id="vignette"></div>
<div id="flash" class="flash"></div>

<script>
// ------------------------------------------------------------------ data (filled by render.py)
// window.PLAN is injected before the first seek(): asset names, frame counts and the crop /
// spotlight rectangles measured off the captured stills.
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => 1 - Math.pow(1 - clamp(t), 3);                 // out-cubic
const inout = (t) => { t = clamp(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
// opacity envelope: fades in over [a, a+fi], out over [b-fo, b]
const env = (t, a, b, fi = .5, fo = .5) => Math.min(ease(seg(t, a, a + fi)), 1 - ease(seg(t, b - fo, b)));

const BAR = 2.5;                       // 96 BPM; the score's bar map is the edit's
const SHIELD = 'M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4Zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8Z';

// ------------------------------------------------------------------ motes (seeded particles)
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const MOTES = Array.from({ length: 140 }, () => ({
  x: rnd() * 1920, y: rnd() * 1080, r: .6 + rnd() * 2.2, v: 6 + rnd() * 22, p: rnd() * 6.28, a: .15 + rnd() * .5 }));
function drawMotes(t, alpha) {
  const c = $('motes').getContext('2d');
  c.clearRect(0, 0, 1920, 1080);
  if (alpha <= 0) return;
  for (const m of MOTES) {
    const y = ((m.y - m.v * t) % 1080 + 1080) % 1080;
    const x = m.x + Math.sin(t * .4 + m.p) * 18;
    const tw = .6 + .4 * Math.sin(t * 1.3 + m.p * 3);
    c.beginPath();
    c.fillStyle = `rgba(150,200,235,${m.a * tw * alpha})`;
    c.arc(x, y, m.r, 0, 6.283);
    c.fill();
  }
}

// ------------------------------------------------------------------ builders
function el(tag, cls, html, parent) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  (parent || document.body).appendChild(e);
  return e;
}
const caps = {};
// A caption: kicker + headline (+ sub). pos = {x, y, align}
function caption(key, spec) {
  const c = el('div', 'cap', null, $('caps'));
  if (spec.kicker) el('div', 'kicker line', spec.kicker, c);
  if (spec.head) el('div', 'head line', spec.head, c).style.marginTop = spec.kicker ? '14px' : '0';
  if (spec.sub) { const s = el('div', 'sub line', spec.sub, c); s.style.marginTop = '18px'; if (spec.subW) s.style.maxWidth = spec.subW + 'px'; }
  c.style.left = spec.x + 'px'; c.style.top = spec.y + 'px';
  if (spec.w) c.style.width = spec.w + 'px';
  if (spec.align) c.style.textAlign = spec.align;
  if (spec.size) c.querySelector('.head').style.fontSize = spec.size + 'px';
  caps[key] = Object.assign({ node: c }, spec);
}
// staggered reveal: each .line slides up and un-blurs, 90 ms apart
function showCap(key, t) {
  const s = caps[key];
  const a = env(t, s.a, s.b, .55, .45);
  s.node.style.opacity = a > 0 ? 1 : 0;
  [...s.node.children].forEach((ln, i) => {
    const k = ease(seg(t, s.a + i * .09, s.a + i * .09 + .6));
    const out = ease(seg(t, s.b - .45, s.b));
    ln.style.opacity = Math.min(k, 1 - out);
    ln.style.transform = `translateY(${(1 - k) * 26 - out * 10}px)`;
    ln.style.filter = `blur(${(1 - k) * 6}px)`;
  });
}

const rooms = {};
// A room: a captured still, cropped (title bar off), placed with a camera path.
function room(key, spec) {
  const w = el('div', 'win', null, $('rooms'));
  const img = el('img', null, null, w);
  img.src = spec.src;
  const [cx, cy, cw, ch] = spec.crop;
  w.style.width = cw + 'px'; w.style.height = ch + 'px';
  img.style.marginLeft = -cx + 'px'; img.style.marginTop = -cy + 'px';
  const spots = (spec.spots || []).map((s) => {
    const d = el('div', 'spot', null, w);
    d.style.left = (s.r[0] - cx) + 'px'; d.style.top = (s.r[1] - cy) + 'px';
    d.style.width = s.r[2] + 'px'; d.style.height = s.r[3] + 'px';
    let tag = null;
    if (s.tag) {
      tag = el('div', 'tag', s.tag, w);
      tag.style.left = (s.r[0] - cx + s.r[2] + 14) + 'px';
      tag.style.top = (s.r[1] - cy + s.r[3] / 2 - 17) + 'px';
      if (s.tagLeft) { tag.style.left = 'auto'; tag.style.right = (cw - (s.r[0] - cx) + 14) + 'px'; }
      if (s.tagBelow) { tag.style.left = (s.r[0] - cx) + 'px'; tag.style.top = (s.r[1] - cy + s.r[3] + 12) + 'px'; }
    }
    return Object.assign({ node: d, tagNode: tag }, s);
  });
  rooms[key] = Object.assign({}, spec, { node: w, spots });
}
// camera: keyframes [{t, x, y, s}] in screen px for the window's top-left and its scale
function camAt(keys, t) {
  if (t <= keys[0].t) return keys[0];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i].t) {
      const k = inout((t - keys[i - 1].t) / (keys[i].t - keys[i - 1].t));
      const a = keys[i - 1], b = keys[i];
      return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), s: lerp(a.s, b.s, k), ry: lerp(a.ry || 0, b.ry || 0, k) };
    }
  }
  return keys[keys.length - 1];
}
function showRoom(key, t) {
  const r = rooms[key];
  const a = env(t, r.a, r.b, .6, .5);
  r.node.style.opacity = a;
  if (a <= 0) return;
  const c = camAt(r.cam, t);
  const rise = (1 - ease(seg(t, r.a, r.a + .8))) * 60;
  r.node.style.transform =
    `perspective(2400px) translate(${c.x}px, ${c.y + rise}px) rotateY(${c.ry || 0}deg) scale(${c.s})`;
  for (const s of r.spots) {
    const k = env(t, s.a, s.b, .35, .35);
    s.node.style.opacity = k;
    s.node.style.transform = `scale(${1.04 - .04 * ease(seg(t, s.a, s.a + .4))})`;
    if (s.tagNode) {
      const kt = env(t, s.a + .2, s.b, .35, .35);
      s.tagNode.style.opacity = kt;
      s.tagNode.style.transform = `translateX(${(1 - ease(seg(t, s.a + .2, s.a + .6))) * -12}px)`;
    }
  }
}

// ------------------------------------------------------------------ image sequences
function seqSrc(dir, pattern, i) { return dir + '/' + pattern.replace('%05d', String(i).padStart(5, '0')); }
async function setImg(img, src) {
  if (img.getAttribute('src') === src) return;
  img.setAttribute('src', src);
  try { await img.decode(); } catch (e) {}
}

// ------------------------------------------------------------------ build + seek
let P;   // the plan
let cards = {};
function build(plan) {
  P = plan;
  for (const [k, spec] of Object.entries(P.captions)) caption(k, spec);
  for (const [k, spec] of Object.entries(P.rooms)) room(k, spec);

  // logo card
  const logo = el('div', null, `
    <svg id="shield" width="150" height="150" viewBox="0 0 24 24" style="display:block;margin:0 auto 34px;filter:drop-shadow(0 0 40px rgba(95,168,211,.55))">
      <path fill="#5FA8D3" d="${SHIELD}"/></svg>
    <div class="word">EQBuddy <b>Evolved</b></div>
    <div class="sub" style="margin-top:26px;font-size:36px;color:#c5ced8">Your personalized guide to Norrath</div>`, $('cards'));
  logo.className = 'center'; logo.style.top = '300px'; logo.style.opacity = 0;
  cards.logo = logo;

  // principles
  const pillars = [
    ['Your log, nothing else', 'Reads only what the game writes for you. No memory reads, no automation.',
     '<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/>'],
    ['Stays on your PC', 'No account. Nothing leaves your PC unless you opt in.',
     '<path d="M4 5h16v11H4zM9 20h6M12 16v4"/>'],
    ['Measures only you', 'Never a meter on anyone else. Personal, not competitive.',
     '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-7 8-7s7 2.5 8 7"/>'],
    ['Evidence, not guesses', 'Numbers from your own kills say so. Estimates say they are estimates.',
     '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
  ];
  cards.pillars = pillars.map(([h, p, ico], i) => {
    const d = el('div', 'pillar', `<div class="ico"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#5FA8D3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ico}</svg></div><h3>${h}</h3><p>${p}</p>`, $('cards'));
    d.style.left = (150 + i * 420) + 'px'; d.style.top = '470px';
    return d;
  });
  const ph = el('div', 'center', '<div class="kicker">Built differently</div><div class="head" style="margin-top:16px">Private. Personal. <em>Honest.</em></div>', $('cards'));
  ph.style.top = '250px'; ph.style.opacity = 0; cards.pillarsHead = ph;

  // end card
  const end = el('div', 'center', `
    <svg width="104" height="104" viewBox="0 0 24 24" style="display:block;margin:0 auto 26px;filter:drop-shadow(0 0 30px rgba(95,168,211,.5))"><path fill="#5FA8D3" d="${SHIELD}"/></svg>
    <div class="word" style="font-size:112px">EQBuddy <b>Evolved</b></div>
    <div class="head" style="font-size:44px;margin-top:26px;font-weight:600">0.1 Beta &nbsp;·&nbsp; <em>out now</em></div>
    <div style="margin-top:34px"><span class="pill">Free</span><span class="pill">Windows</span><span class="pill">No account</span><span class="pill">Code-signed</span></div>
    <div class="sub" style="margin-top:40px;font-size:32px;color:#e4e9ef;letter-spacing:.02em">dranakcorps-bot.github.io/EQBuddy</div>`, $('cards'));
  end.style.top = '215px'; end.style.opacity = 0; cards.end = end;
  const legal = el('div', 'center', 'EQBuddy is a fan-made companion tool and is not affiliated with the publishers of EverQuest Legends. Character and play shown are the developer\'s own, from a real game log.', $('cards'));
  legal.style.top = '1010px'; legal.style.fontSize = '17px'; legal.style.color = '#6f7a86'; legal.style.opacity = 0;
  cards.legal = legal;

  // phone
  const phone = el('div', 'phone', `<div class="screen"><img id="phoneImg" src="${P.phone.src}"></div><div class="notch"></div>`, $('cards'));
  cards.phone = phone;
}

window.seek = async function (t) {
  const waits = [];
  // background motes: strongest on the title cards, faint elsewhere
  const cardish = Math.max(env(t, 0, 10.2, .8, .6), env(t, 52.3, 70, .6, .1));
  drawMotes(t, .35 + .65 * cardish);

  // ---- game backdrop + live HUD (10 - 25) ----
  const G = P.game, H = P.hud;
  const gA = env(t, 9.6, 25.4, .45, .6);
  $('game').style.opacity = gA;
  if (gA > 0) {
    const gi = Math.floor((G.start + (t - 9.6) * G.rate) * G.fps) % G.frames + 1;
    waits.push(setImg($('gameImg'), seqSrc(G.dir, G.pattern, gi)));
    const drift = (t - 10) * 3;
    $('gameImg').style.transform = `translate(${-drift}px, ${-drift * .3}px) scale(1.04)`;
  }
  const hA = env(t, 10.0, 25.3, .5, .5);
  $('hud').style.opacity = hA;
  if (hA > 0) {
    // which recorded frame: two cuts into the take, one per beat
    const beat = t < 20 ? H.beats[0] : H.beats[1];
    const bt = t < 20 ? t - 10 : t - 20;
    const hi = clamp(Math.round((beat.from + bt) * H.fps), 1, H.frames);
    waits.push(setImg($('hudImg'), seqSrc(H.dir, H.pattern, hi)));
    const c = camAt(t < 20 ? H.cam[0] : H.cam[1], t);
    const drop = (1 - ease(seg(t, 10, 10.7))) * -40;
    $('hud').style.transform = `translate(${c.x}px, ${c.y + drop}px) scale(${c.s})`;
  }

  // ---- captions ----
  for (const k of Object.keys(caps)) showCap(k, t);

  // ---- rooms ----
  for (const k of Object.keys(rooms)) showRoom(k, t);

  // ---- logo card (5 - 10) ----
  const lA = env(t, 5.0, 9.9, .25, .6);
  cards.logo.style.opacity = lA;
  const lk = ease(seg(t, 5.0, 6.6));
  cards.logo.style.transform = `scale(${1.12 - .12 * lk})`;
  cards.logo.style.filter = `blur(${(1 - ease(seg(t, 5.0, 5.7))) * 14}px)`;

  // ---- phone (47.5 - 52.5) ----
  const pA = env(t, P.phone.a, P.phone.b, .6, .45);
  cards.phone.style.opacity = pA;
  if (pA > 0) {
    const k = ease(seg(t, P.phone.a, P.phone.a + 1.0));
    cards.phone.style.left = P.phone.x + 'px'; cards.phone.style.top = P.phone.y + 'px';
    cards.phone.style.transform = `translateY(${(1 - k) * 120}px) rotate(${(1 - k) * 6 - 3}deg)`;
    const scroll = inout(seg(t, P.phone.a + 1.2, P.phone.b - .4)) * P.phone.scroll;
    $('phoneImg').style.transform = `translateY(${-scroll}px)`;
  }

  // ---- principles (52.5 - 57.5) ----
  cards.pillarsHead.style.opacity = env(t, 52.5, 57.4, .5, .4);
  cards.pillars.forEach((d, i) => {
    const a = 53.1 + i * .45;
    const k = ease(seg(t, a, a + .6));
    d.style.opacity = Math.min(k, 1 - ease(seg(t, 57.0, 57.4)));
    d.style.transform = `translateY(${(1 - k) * 34}px)`;
  });

  // ---- end card (57.5 - end) ----
  const eA = env(t, 57.5, 66, .35, .9);
  cards.end.style.opacity = eA;
  cards.end.style.transform = `scale(${1.08 - .08 * ease(seg(t, 57.5, 59.2))})`;
  cards.legal.style.opacity = env(t, 59.0, 66, .8, .9) * .9;

  // ---- impacts: a short flash on the logo, the drop and the end card ----
  const fl = (a) => Math.max(0, 1 - (t - a) / .35) * (t >= a ? 1 : 0);
  $('flash').style.opacity = Math.max(fl(5.0) * .55, fl(10.0) * .25, fl(57.5) * .5);

  await Promise.all(waits);
  return true;
};

window.load = async function (plan) {
  build(plan);
  await document.fonts.ready;
  await Promise.all([...document.images].filter((i) => i.getAttribute('src')).map((i) => i.decode().catch(() => {})));
  return true;
};
</script>
</body>
</html>
